<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<style>
body{
    background-image: url("https://ssfgc.ac.in/wp-content/uploads/2025/11/gsss-fg-mainslider.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.card{
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(5px);
}
</style>

<body class="bg-light">

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg rounded-4">

<div class="card-header bg-primary text-white text-center">

<h3 class="fw-bold">
Student Registration
</h3>

</div>

<div class="card-body p-4">

<form>

<!-- College -->

<div class="mb-3">

<label class="form-label fw-bold">
College Name
</label>

<input
type="text"
class="form-control"
value="GSSS Simha Subba Mahalakshmi First Grade College, University of Mysore"
readonly>

</div>

<!-- Student Name -->

<div class="mb-3">
<label class="form-label fw-bold">
Student Name
</label>
<input
type="text"
class="form-control"
placeholder="Enter your full name">
</div>
<div claas="mb-3">
<label class="form-label fw-bold">
Registration Number
</label>
<input
type="text"
class="form-control"
placeholder="Enter your registration number">
</div>
<!-- Section -->

<div class="mb-3">

<label class="form-label fw-bold">
Year and Section
</label>

<select class="form-select">

<option selected>
Select Year and Section 
</option>

<option>1st Year / A</option>

<option>2nd Year / B</option>

<option>3rd Year / C</option>

</select>

</div>

<!-- Branch -->

<div class="mb-3">

<label class="form-label fw-bold">
Branch
</label>

<select class="form-select">

<option selected>
Select Branch
</option>

<option>BCA</option>

<option>BBA</option>

<option>B.Com</option>

</select>

</div>

<!-- Email -->

<div class="mb-3">

<label class="form-label fw-bold">
Email Address
</label>

<input
type="email"
class="form-control"
placeholder="name.nss@gmail.com">

</div>

<!-- Upload Photo -->

<div class="mb-3">

<label class="form-label fw-bold">
Upload Passport Size Photo
</label>

<input
type="file"
class="form-control"
accept="image/*">

</div>

<!-- Upload Receipt -->

<div class="mb-3">

<label class="form-label fw-bold">
Upload College Fee Receipt
</label>

<input
type="file"
class="form-control"
accept=".pdf,.jpg,.jpeg,.png">

</div>

<!-- Password -->

<div class="mb-3">

<label class="form-label fw-bold">
Password
</label>

<input
type="password"
class="form-control"
placeholder="Create Password">

</div>

<!-- Confirm Password -->

<div class="mb-4">

<label class="form-label fw-bold">
Confirm Password
</label>

<input
type="password"
class="form-control"
placeholder="Re-enter Password">

</div>

<!-- Register -->

<div class="d-flex justify-content-between mt-4">

    <button type="reset"
            class="btn btn-outline-secondary">
        Reset
    </button>

    <button type="button"
            class="btn btn-success">
        Save
    </button>

    <a href="register2.html"
       class="btn btn-primary">
        Next Page →
    </a>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
