<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>NSS Registration - Page 2</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{

background-image:url("https://ssfgc.ac.in/wp-content/uploads/2025/11/gsss-fg-mainslider.png");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

background-attachment:fixed;

}

.card{

background:rgba(255,255,255,.92);

backdrop-filter:blur(5px);

}

</style>

</head>

<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow-lg rounded-4">

<div class="card-header bg-primary text-white">

<h3 class="fw-bold mb-0">

NSS Registration - Page 2

</h3>


</div>

<div class="card-body">

<div class="mb-4">

<label class="form-label fw-bold">

Blood Group

</label>

<select class="form-select">

<option selected>Select Blood Group</option>

<option>A+</option>

<option>A-</option>

<option>B+</option>

<option>B-</option>

<option>AB+</option>

<option>AB-</option>

<option>O+</option>

<option>O-</option>

</select>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

Are you willing to donate blood?

</label>

<div>

<input class="form-check-input"
type="radio"
name="blood">

<label class="form-check-label">

Yes

</label>

</div>

<div>

<input class="form-check-input"
type="radio"
name="blood">

<label class="form-check-label">

No

</label>

</div>

</div>
<div class="mb-4">

<label class="form-label fw-bold">

Areas of Interest

</label>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label class="form-check-label">

Blood Donation

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Tree Plantation

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Health Awareness

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Village Adoption

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Disaster Relief

</label>

</div>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

Skills

</label>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Leadership

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Public Speaking

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Photography

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Graphic Design

</label>

</div>

<div class="form-check">

<input class="form-check-input"
type="checkbox">

<label>

Programming

</label>

</div>

</div>

<!--Motivation -->
<div class="mb-4">

<label class="form-label fw-bold">

Why do you want to join NSS?

</label>

<textarea

class="form-control"

rows="5"

placeholder="Write your motivation in about 150-200 words.">

</textarea>

</div>

<!--Volunteer Experience -->

<div class="mb-4">

<label class="form-label fw-bold">

Previous Volunteer Experience

</label>

<select class="form-select">

<option selected>Select</option>

<option>Yes</option>

<option>No</option>

</select>

</div>

<div class="mb-4">

<label class="form-label fw-bold">

Available on Weekends?

</label>

<div>

<input class="form-check-input"
type="radio"
name="weekend">

<label>

Yes

</label>

</div>

<div>

<input class="form-check-input"
type="radio"
name="weekend">

<label>

No

</label>

</div>

</div>
<!--Declaration -->
 <div class="form-check mb-4">

<input class="form-check-input"
type="checkbox">

<label class="form-check-label">

I certify that all the information provided by me is true.

</label>

</div>

  <div class="d-flex justify-content-between">

<a href="register.html"
class="btn btn-secondary">

← Previous

</a>

<button type="reset"
class="btn btn-outline-secondary">

Reset

</button>

<button type="submit"
class="btn btn-primary">

Submit Application

</button>

</div>

</form>
</form>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
