<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>
<style>
body{
    background-image:url("https://ssfgc.ac.in/wp-content/uploads/2025/11/gsss-fg-mainslider.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.card{
    background:rgba(255,255,255,0.92);
    backdrop-filter:blur(5px);
}
</style>
<body>
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card shadow-lg rounded-4">

                <!-- Card Header -->
                <div class="card-header bg-primary text-white text-center">

                    <h2 class="fw-bold mb-1">
                        Request for Service
                    </h2>

                    <p class="mb-0">
                        "Not Me But You – Partner with NSS to build a stronger,
                        healthier and more responsible society."
                    </p>

                </div>

                <!-- Card Body -->
                <div class="card-body p-4">

                    <form>


                        
<!-- ================= Organization Details ================= -->

<h5 class="text-primary fw-bold mb-3">
    Organization Details
</h5>

<div class="mb-3">
    <label class="form-label fw-bold">Organization Name *</label>
    <input type="text" class="form-control"
           placeholder="Enter Organization Name">
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Organization Type *</label>
    <select class="form-select">
        <option selected>Select Organization Type</option>
        <option>NGO</option>
        <option>Government Department</option>
        <option>School</option>
        <option>College</option>
        <option>Hospital</option>
        <option>Company (CSR)</option>
        <option>Trust</option>
        <option>Village Panchayat</option>
        <option>Resident Welfare Association</option>
        <option>Other</option>
    </select>
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Organization Registration Number</label>
    <input type="text" class="form-control"
           placeholder="Enter Registration Number">
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Official Website (Optional)</label>
    <input type="url" class="form-control"
           placeholder="https://www.example.org">
</div>

<div class="mb-4">
    <label class="form-label fw-bold">Organization Address *</label>
    <textarea class="form-control"
              rows="3"
              placeholder="Enter Complete Address"></textarea>
</div>

<!-- ================= Contact Person ================= -->

<h5 class="text-primary fw-bold mb-3">
    Contact Person
</h5>

<div class="mb-3">
    <label class="form-label fw-bold">Contact Person Name *</label>
    <input type="text" class="form-control"
           placeholder="Enter Full Name">
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Designation</label>
    <input type="text" class="form-control"
           placeholder="Example: HR Manager / Principal / Coordinator">
</div>

<div class="mb-3">
    <label class="form-label fw-bold">Official Email Address *</label>
    <input type="email" class="form-control"
           placeholder="organization@example.com">
</div>

<div class="mb-4">
    <label class="form-label fw-bold">Official Contact Number *</label>
    <input type="tel" class="form-control"
           placeholder="+91 XXXXXXXXXX">
</div>

<!-- ================= Upload Documents ================= -->

<h5 class="text-primary fw-bold mb-3">
    Upload Documents
</h5>

<div class="mb-3">
    <label class="form-label fw-bold">
        Upload Organization Visiting Card
    </label>

    <input type="file"
           class="form-control"
           accept=".jpg,.jpeg,.png,.pdf">
</div>

<div class="mb-4">
    <label class="form-label fw-bold">
        Upload Official Request Letter (Optional)
    </label>

    <input type="file"
           class="form-control"
           accept=".pdf,.jpg,.jpeg,.png">
</div>

<!-- ================= Required Service ================= -->

<h5 class="text-primary fw-bold mb-3">
    Service Required
</h5>

<div class="row">

<div class="col-md-6">

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Blood Donation Camp</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Tree Plantation</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Cleanliness Drive</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Medical Camp</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Health Awareness</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Digital Literacy</label>
</div>

</div>

<div class="col-md-6">

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Village Survey</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Event Volunteers</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Traffic Awareness</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Disaster Relief</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Career Guidance</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Other Community Service</label>
</div>

</div>

</div>

<hr>

<!-- ================= Event Details ================= -->

<h5 class="text-primary fw-bold mb-3">
    Event Details
</h5>

<div class="mb-3">
<label class="form-label fw-bold">Event Title *</label>
<input type="text"
class="form-control"
placeholder="Enter Event Name">
</div>

<div class="mb-3">
<label class="form-label fw-bold">Purpose of the Event *</label>
<textarea class="form-control"
rows="4"
placeholder="Describe the objective of the event"></textarea>
</div>

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label fw-bold">Preferred Date</label>
<input type="date" class="form-control">
</div>

<div class="col-md-6 mb-3">
<label class="form-label fw-bold">Number of Days</label>
<select class="form-select">
<option selected>Select</option>
<option>1 Day</option>
<option>2 Days</option>
<option>3 Days</option>
<option>5 Days</option>
<option>7 Days</option>
<option>More than 7 Days</option>
</select>
</div>

</div>

<div class="mb-3">
<label class="form-label fw-bold">
Expected Number of Volunteers
</label>

<input type="number"
class="form-control"
placeholder="Example: 25">
</div>

<div class="mb-4">
<label class="form-label fw-bold">
Estimated Number of Beneficiaries
</label>

<input type="number"
class="form-control"
placeholder="Example: 500">
</div>

<!-- ================= Facilities ================= -->

<h5 class="text-primary fw-bold mb-3">
Facilities Provided
</h5>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Food</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Transportation</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Accommodation</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">First Aid</label>
</div>

<div class="form-check mb-4">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Drinking Water</label>
</div>

<!-- ================= Additional Information ================= -->

<h5 class="text-primary fw-bold mb-3">
Additional Information
</h5>

<div class="mb-3">
<label class="form-label fw-bold">
Additional Notes
</label>

<textarea class="form-control"
rows="5"
placeholder="Describe your expectations from NSS volunteers"></textarea>
</div>

<div class="mb-3">
<label class="form-label fw-bold">
Priority Level
</label>

<select class="form-select">
<option selected>Select Priority</option>
<option>Emergency</option>
<option>High</option>
<option>Medium</option>
<option>Low</option>
</select>
</div>

<div class="mb-4">
<label class="form-label fw-bold">
Previous Collaboration with NSS
</label>

<div class="form-check">
<input class="form-check-input"
type="radio"
name="previousNSS">

<label class="form-check-label">
Yes
</label>
</div>

<div class="form-check">
<input class="form-check-input"
type="radio"
name="previousNSS">

<label class="form-check-label">
No
</label>
</div>

</div>

<!-- ================= Declaration ================= -->

<div class="form-check mb-4">

<input class="form-check-input"
type="checkbox"
required>

<label class="form-check-label">

I hereby declare that the information provided above is true and that this service request is submitted on behalf of the organization for a genuine community purpose.

</label>

</div>
<hr class="my-4">

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between flex-wrap gap-2">

                            <button type="reset"
                                    class="btn btn-outline-secondary px-4">
                                Reset
                            </button>

                            <button type="submit"
                                    class="btn btn-primary px-4">
                                Submit Request
                            </button>

                            <a href="contact.html"
                               class="btn btn-success px-4">
                                Contact NSS
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
